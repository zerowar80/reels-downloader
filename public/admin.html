<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 · Reels Downloader</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="brand-badge">⬇</div>
      <div class="brand-title">Reels Downloader · 관리자</div>
    </div>
    <div class="userbox">
      <a href="index.html" class="btn btn-ghost" style="width:auto; padding:8px 14px; text-decoration:none;">메인으로</a>
      <button class="btn btn-ghost" id="logoutBtn" style="width:auto; padding:8px 14px;">로그아웃</button>
    </div>
  </div>

  <div class="container">
    <div class="stats-row" id="statsRow"></div>

    <h2 style="font-size:16px; margin: 30px 0 14px;">사용자 목록</h2>
    <div id="errorBanner" class="error-box"></div>
    <table class="admin-table">
      <thead>
        <tr>
          <th>아이디</th>
          <th>권한</th>
          <th>다운로드 수</th>
          <th>사용 용량</th>
          <th>가입일</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="userTableBody"></tbody>
    </table>
  </div>

  <script src="admin.js"></script>
</body>
</html>
