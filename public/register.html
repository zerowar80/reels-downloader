<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회원가입 · Reels Downloader</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand">
        <div class="brand-badge">⬇</div>
        <div>
          <div class="brand-title">Reels Downloader</div>
          <div class="brand-sub">개인용 릴스/쇼츠 다운로더</div>
        </div>
      </div>

      <div class="error-box" id="errorBox"></div>

      <form id="registerForm">
        <div class="field">
          <label>아이디</label>
          <input type="text" id="username" autocomplete="username" required />
        </div>
        <div class="field">
          <label>비밀번호 (6자 이상)</label>
          <input type="password" id="password" autocomplete="new-password" minlength="6" required />
        </div>
        <div class="field">
          <label>비밀번호 확인</label>
          <input type="password" id="password2" autocomplete="new-password" minlength="6" required />
        </div>
        <button class="btn" type="submit" id="submitBtn">회원가입</button>
      </form>

      <div class="switch-link">
        이미 계정이 있으신가요? <a href="login.html">로그인</a>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    fetch('/api/auth/me').then(r => { if (r.ok) location.href = 'index.html'; });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');

      const pw = document.getElementById('password').value;
      const pw2 = document.getElementById('password2').value;
      if (pw !== pw2) {
        errorBox.textContent = '비밀번호가 일치하지 않습니다.';
        errorBox.classList.add('show');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '가입 중...';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: pw
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '회원가입에 실패했습니다.');
        location.href = 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = '회원가입';
      }
    });
  </script>
</body>
</html>
