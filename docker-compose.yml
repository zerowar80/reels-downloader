version: "3.8"

services:
  reels-downloader:
    build: .
    container_name: reels-downloader
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
      # 반드시 아래 값을 임의의 긴 랜덤 문자열로 변경하세요
      - JWT_SECRET=please_change_this_to_a_long_random_string
      # 계정을 하나 만든 뒤에는 false로 바꿔서 추가 가입을 막는 것을 권장합니다
      - ALLOW_REGISTRATION=true
      # https(리버스 프록시 등)로 서비스한다면 true로 변경 권장
      - COOKIE_SECURE=false
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
